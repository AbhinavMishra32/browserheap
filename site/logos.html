<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browserheap logos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Instrument+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Silkscreen&family=Pixelify+Sans:wght@400..700&family=DotGothic16&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400..700&family=Unbounded:wght@400..700&family=Doto:wght@400..900&display=swap">
<style>
/* A sheet of logo options: marks, wordmarks in different fonts, and lockups.
   Every mark is drawn by the script below from a grid of cells, like logo.py. */
:root {
  --bg: #070908;
  --panel: #0d1110;
  --ink: #eef4f1;
  --ink-2: rgb(238 244 241 / 0.7);
  --ink-3: rgb(238 244 241 / 0.45);
  --line: rgb(238 244 241 / 0.1);
  --jade: #1fd8a4;
  --cyan: #4ccce6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 48px 24px 96px; }
h1 { margin: 0 0 6px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
h2 { margin: 56px 0 16px; font-size: 18px; font-weight: 600; }
p.lede { margin: 0; color: var(--ink-2); max-width: 70ch; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { position: relative; display: grid; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
.id { position: absolute; top: 12px; left: 14px; font: 600 12px "Geist Mono", monospace; color: var(--jade); }
.name { font-size: 13px; color: var(--ink-3); }
.stage { display: grid; place-items: center; height: 150px; }
.stage svg { width: 96px; height: 96px; overflow: visible; }
.sizes { display: flex; align-items: center; gap: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.sizes svg { overflow: visible; }
.sizes .light { display: flex; align-items: center; gap: 14px; margin-left: auto; padding: 6px 10px; border-radius: 8px; background: #f4f6f5; }
.word-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.lockup { display: flex; align-items: center; gap: 12px; min-height: 96px; }
.lockup svg { width: 34px; height: 34px; flex: none; overflow: visible; }
.lockup .word { font-size: 32px; line-height: 1; white-space: nowrap; }
.big .lockup { justify-content: center; min-height: 150px; }
.big .lockup svg { width: 46px; height: 46px; }
.big .lockup .word { font-size: 40px; }
.on-light { background: #f4f6f5; color: #0b0f0e; border-color: transparent; }
.on-light .name { color: rgb(11 15 14 / 0.5); }
</style>
</head>
<body>
<main>
  <h1>Browserheap logos</h1>
  <p class="lede">Every option has a name: say "M4 with F7", or "L3". Marks are shown large, then at 16, 24 and 32 px on dark and on light, the sizes a favicon and a README get.</p>

  <h2>Marks</h2>
  <div class="grid" id="marks"></div>

  <h2>Wordmarks, with the current mark</h2>
  <div class="word-grid" id="words"></div>

  <h2>Lockups</h2>
  <div class="word-grid big" id="lockups"></div>
</main>

<script>
const NS = "http://www.w3.org/2000/svg"
const JADE = "#1fd8a4"
const CYAN = "#4ccce6"
const DIM = "#2b3a36"
// The 4×4 ordered-dither pattern logo.py uses: a cell is on when its brightness beats its threshold.
const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]]

function mix(a, b, t) {
  const channel = (hex, i) => parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16)
  let out = "#"
  for (let i = 0; i < 3; i++) {
    out += Math.round(channel(a, i) * (1 - t) + channel(b, i) * t).toString(16).padStart(2, "0")
  }
  return out
}

function dithered(x, y, brightness) {
  return brightness > (BAYER4[y % 4][x % 4] + 0.5) / 16
}

/**
 * An SVG mark from cells on a grid: each cell { x, y, size?, color? }.
 * Cells are drawn as rounded squares, with a blurred copy behind for glow.
 */
function cellMark(n, cells, { glow = true } = {}) {
  const pitch = 3
  let rects = ""
  for (const cell of cells) {
    const size = cell.size ?? 2.7
    const offset = (2.7 - size) / 2
    const color = cell.color ?? mix(JADE, CYAN, (cell.x + (n - 1 - cell.y) * 0.5) / (n * 1.5))
    rects += `<rect x="${(cell.x * pitch + offset).toFixed(2)}" y="${(cell.y * pitch + offset).toFixed(2)}" width="${size.toFixed(2)}" height="${size.toFixed(2)}" rx="0.35" fill="${color}"/>`
  }
  const side = n * pitch - 0.3
  const glowLayer = glow ? `<g filter="url(#glow)" opacity="0.75">${rects}</g>` : ""
  return `<svg xmlns="${NS}" viewBox="-2 -2 ${side + 4} ${side + 4}"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter></defs>${glowLayer}<g>${rects}</g></svg>`
}

/** A mark drawn with plain SVG shapes in a 32×32 box. */
function shapeMark(inner) {
  return `<svg xmlns="${NS}" viewBox="0 0 32 32"><defs><linearGradient id="jc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${JADE}"/><stop offset="1" stop-color="${CYAN}"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>${inner}</svg>`
}

// ---- The marks ----

const MARKS = []

// M1: today's mark, from logo.py: a window whose page dissolves toward the top right.
MARKS.push({ name: "Current: the page dissolves", svg: (() => {
  const n = 9
  const cells = []
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      if (y === 0) {
        cells.push({ x, y })
      } else if (y > 1) {
        const brightness = 1.15 - ((x / (n - 1)) * 0.65 + ((n - 1 - y) / (n - 3)) * 0.55)
        if (dithered(x, y, brightness)) {
          cells.push({ x, y, size: 1.3 + 1.4 * Math.min(1, Math.max(0, brightness)) })
        }
      }
    }
  }
  return cellMark(n, cells)
})() })

// M2: a heap of tabs. Three tabs stacked; the front one is live, the ones behind are only dots.
MARKS.push({ name: "Heap: one live tab in front of sleeping ones", svg: shapeMark(`
  <g fill="none" stroke="${CYAN}" stroke-width="1.4" stroke-dasharray="0.1 2.4" stroke-linecap="round" opacity="0.8">
    <path d="M11 4h12a2 2 0 0 1 2 2v11"/><path d="M7 8h12a2 2 0 0 1 2 2v11"/>
  </g>
  <rect x="3" y="12" width="16" height="16" rx="3" fill="url(#jc)" filter="url(#soft)" opacity="0.6"/>
  <rect x="3" y="12" width="16" height="16" rx="3" fill="url(#jc)"/>
  <rect x="6" y="16" width="7" height="1.6" rx="0.8" fill="#07211b"/>`) })

// M3: 2 live, the rest asleep: a 3×3 grid of tabs, two lit, seven as dots.
MARKS.push({ name: "Two live: the rule, as a grid", svg: (() => {
  let inner = ""
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      const x = 2 + col * 10
      const y = 2 + row * 10
      const live = (row === 0 && col === 0) || (row === 0 && col === 1)
      if (live) {
        inner += `<rect x="${x}" y="${y}" width="8" height="8" rx="2" fill="url(#jc)"/>`
      } else {
        inner += `<circle cx="${x + 4}" cy="${y + 4}" r="1.3" fill="${CYAN}" opacity="0.55"/>`
      }
    }
  }
  return shapeMark(`<g filter="url(#soft)" opacity="0.6">${inner}</g>${inner}`)
})() })

// M4: a pile of pixels: a heap shape, bright at the top, dithering away toward the bottom.
MARKS.push({ name: "Pixel pile: bright on top, asleep below", svg: (() => {
  const n = 9
  const cells = []
  for (let y = 0; y < n; y++) {
    const half = Math.floor((y + 1) / 2) + 0.5
    for (let x = 0; x < n; x++) {
      if (Math.abs(x - (n - 1) / 2) <= half + 0.01 && y >= 1) {
        const brightness = 1.1 - y / (n - 1)
        if (y <= 2 || dithered(x, y, brightness + 0.25)) {
          cells.push({ x, y, size: y <= 2 ? 2.7 : 1.4 + brightness })
        }
      }
    }
  }
  return cellMark(n, cells)
})() })

// M5: a browser tab with a crescent cut out: the tab is asleep, not gone.
MARKS.push({ name: "Sleeping tab: a tab with a moon cut out", svg: shapeMark(`
  <mask id="moon"><rect width="32" height="32" fill="#fff"/><circle cx="19" cy="18" r="6" fill="#000"/><circle cx="22" cy="15.5" r="5.2" fill="#fff"/></mask>
  <path d="M4 26V8.5A3.5 3.5 0 0 1 7.5 5h17A3.5 3.5 0 0 1 28 8.5V26Z" fill="url(#jc)" filter="url(#soft)" opacity="0.55"/>
  <path d="M4 26V8.5A3.5 3.5 0 0 1 7.5 5h17A3.5 3.5 0 0 1 28 8.5V26Z" fill="url(#jc)" mask="url(#moon)"/>
  <rect x="2" y="26" width="28" height="2" rx="1" fill="url(#jc)" opacity="0.5"/>`) })

// M6: the window, its page sinking into dots from the bottom.
MARKS.push({ name: "Window: the page settles into dots", svg: (() => {
  const n = 9
  const cells = []
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const edge = x === 0 || x === n - 1 || y === n - 1
      if (y === 0 || edge) {
        // The window's frame stays whole.
        cells.push({ x, y, size: y === 0 ? 2.7 : 1.6 })
      } else if (y >= 2) {
        const brightness = 1 - (y - 2) / (n - 4)
        if (dithered(x, y, brightness + 0.2)) {
          cells.push({ x, y, size: 1.1 + 1.6 * Math.max(0, brightness) })
        }
      }
    }
  }
  return cellMark(n, cells)
})() })

// M7: a pixel B, solid at the top, dithering out at the bottom.
MARKS.push({ name: "Pixel B: the letter, half asleep", svg: (() => {
  const shape = [
    "XXXXXX.",
    "XX...XX",
    "XX...XX",
    "XXXXXX.",
    "XX...XX",
    "XX...XX",
    "XXXXXX.",
  ]
  const cells = []
  shape.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) {
      if (line[x] === "X") {
        // Every cell of the B stays; the lower half's dots shrink, as if dozing off.
        const brightness = Math.min(1, 1.5 - y / 5)
        cells.push({ x, y, size: 1.3 + 1.4 * brightness })
      }
    }
  })
  return cellMark(7, cells)
})() })

// M8: a tab strip: five tabs, two lit, three as outlines.
MARKS.push({ name: "Tab strip: two of five lit", svg: shapeMark(`
  ${[0, 1, 2, 3, 4].map((i) => {
    const y = 4 + i * 5.2
    if (i < 2) {
      return `<rect x="4" y="${y}" width="24" height="4" rx="2" fill="url(#jc)"/><rect x="4" y="${y}" width="24" height="4" rx="2" fill="url(#jc)" filter="url(#soft)" opacity="0.5"/>`
    }
    return `<rect x="4.6" y="${y + 0.6}" width="${24 - i * 4}" height="2.8" rx="1.4" fill="none" stroke="${CYAN}" stroke-width="1" stroke-dasharray="0.1 2" stroke-linecap="round" opacity="0.7"/>`
  }).join("")}`) })

// M9: a dithered moon: half lit, half asleep, round.
MARKS.push({ name: "Dither moon: awake and asleep in one", svg: (() => {
  const n = 9
  const cells = []
  const middle = (n - 1) / 2
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const distance = Math.hypot(x - middle, y - middle)
      if (distance <= middle + 0.2) {
        const brightness = 1.05 - x / (n - 1)
        if (dithered(x, y, brightness + 0.15)) {
          cells.push({ x, y, size: 1.3 + 1.4 * Math.min(1, brightness + 0.2) })
        }
      }
    }
  }
  return cellMark(n, cells)
})() })

// M10: brackets around a live dot: a container that holds tabs, minimal.
MARKS.push({ name: "Brackets: a heap holding one live page", svg: shapeMark(`
  <path d="M10 5H6v22h4M22 5h4v22h-4" fill="none" stroke="url(#jc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="4.5" fill="url(#jc)" filter="url(#soft)" opacity="0.7"/>
  <circle cx="16" cy="16" r="4.5" fill="url(#jc)"/>
  <circle cx="16" cy="9" r="1.1" fill="${CYAN}" opacity="0.6"/><circle cx="16" cy="23" r="1.1" fill="${CYAN}" opacity="0.6"/>`) })

// M11: stacked cards from above, fanned, the top one live.
MARKS.push({ name: "Fanned stack: tabs piled up", svg: shapeMark(`
  <rect x="9" y="5" width="18" height="13" rx="2.5" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.35" transform="rotate(8 18 11)"/>
  <rect x="7" y="8" width="18" height="13" rx="2.5" fill="none" stroke="${CYAN}" stroke-width="1.2" opacity="0.6" transform="rotate(4 16 14)"/>
  <rect x="5" y="12" width="18" height="14" rx="2.5" fill="url(#jc)" filter="url(#soft)" opacity="0.55"/>
  <rect x="5" y="12" width="18" height="14" rx="2.5" fill="url(#jc)"/>
  <rect x="5" y="12" width="18" height="3.4" rx="1.6" fill="#07211b" opacity="0.35"/>`) })

// M12: a single dot-matrix "h" for heap, with a sleeping trail.
MARKS.push({ name: "Dot h: compact, for small sizes", svg: (() => {
  const shape = [
    "XX.....",
    "XX.....",
    "XXXXXX.",
    "XXX..XX",
    "XX...XX",
    "XX...XX",
    "XX...XX",
  ]
  const cells = []
  shape.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) {
      if (line[x] === "X") {
        const brightness = 1.15 - x / 7
        cells.push({ x, y, size: 1.6 + 1.1 * Math.min(1, brightness + 0.1) })
      }
    }
  })
  return cellMark(7, cells)
})() })

// ---- Fonts for the wordmark ----

const FONTS = [
  { family: "Inter", weight: 600, tracking: "-0.03em", note: "Inter 600 (today)" },
  { family: "Geist", weight: 600, tracking: "-0.04em", note: "Geist 600" },
  { family: "Geist Mono", weight: 500, tracking: "-0.04em", note: "Geist Mono 500" },
  { family: "Space Grotesk", weight: 600, tracking: "-0.04em", note: "Space Grotesk 600" },
  { family: "JetBrains Mono", weight: 600, tracking: "-0.05em", note: "JetBrains Mono 600" },
  { family: "Instrument Serif", weight: 400, tracking: "-0.01em", note: "Instrument Serif" },
  { family: "Bricolage Grotesque", weight: 650, tracking: "-0.04em", note: "Bricolage Grotesque 650" },
  { family: "Sora", weight: 600, tracking: "-0.04em", note: "Sora 600" },
  { family: "Unbounded", weight: 500, tracking: "-0.05em", note: "Unbounded 500" },
  { family: "IBM Plex Mono", weight: 500, tracking: "-0.04em", note: "IBM Plex Mono 500" },
  { family: "Doto", weight: 800, tracking: "0", note: "Doto 800 (dot matrix)" },
  { family: "Silkscreen", weight: 400, tracking: "0", note: "Silkscreen (pixel)", lower: true },
  { family: "Pixelify Sans", weight: 600, tracking: "-0.02em", note: "Pixelify Sans 600" },
  { family: "DotGothic16", weight: 400, tracking: "-0.02em", note: "DotGothic16" },
]

function wordStyle(font) {
  return `font-family: '${font.family}'; font-weight: ${font.weight}; letter-spacing: ${font.tracking}`
}

function wordmark(font, text = "Browserheap") {
  return `<span class="word" style="${wordStyle(font)}">${font.lower ? text.toLowerCase() : text}</span>`
}

// ---- The sheet ----

const marksGrid = document.getElementById("marks")
MARKS.forEach((mark, i) => {
  const sizes = [16, 24, 32].map((px) => mark.svg.replace("<svg ", `<svg width="${px}" height="${px}" `)).join("")
  marksGrid.insertAdjacentHTML("beforeend", `
    <div class="card">
      <span class="id">M${i + 1}</span>
      <div class="stage">${mark.svg}</div>
      <div class="name">${mark.name}</div>
      <div class="sizes">${sizes}<span class="light">${sizes}</span></div>
    </div>`)
})

const wordsGrid = document.getElementById("words")
FONTS.forEach((font, i) => {
  wordsGrid.insertAdjacentHTML("beforeend", `
    <div class="card">
      <span class="id">F${i + 1}</span>
      <div class="lockup">${MARKS[0].svg}${wordmark(font)}</div>
      <div class="name">${font.note}</div>
    </div>`)
})

// Pairings that seem to fit each other: [mark number, font number, dark or light].
const LOCKUPS = [
  [2, 2, "dark"],
  [3, 4, "dark"],
  [4, 7, "dark"],
  [6, 3, "dark"],
  [9, 11, "dark"],
  [11, 6, "dark"],
  [12, 5, "dark"],
  [2, 2, "light"],
]
const lockupGrid = document.getElementById("lockups")
LOCKUPS.forEach(([markNumber, fontNumber, ground], i) => {
  const font = FONTS[fontNumber - 1]
  lockupGrid.insertAdjacentHTML("beforeend", `
    <div class="card ${ground === "light" ? "on-light" : ""}">
      <span class="id">L${i + 1}</span>
      <div class="lockup">${MARKS[markNumber - 1].svg}${wordmark(font)}</div>
      <div class="name">M${markNumber} with F${fontNumber} (${font.note}), on ${ground}</div>
    </div>`)
})
</script>
</body>
</html>
